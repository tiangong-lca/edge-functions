name: CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - deno.json
      - supabase/functions/deno.json
      - .nvmrc
      - .tool-versions
      - .github/dependabot.yml
      - .github/workflows/**
      - scripts/dependency-ci-contract.test.cjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-dependency-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          version: 11.24.0
          runtime: node@24.19.0
          cache: true
          install: false

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version-file: .tool-versions

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint docs and config
        run: pnpm lint

      - name: Full Deno validation
        run: pnpm check
